<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loading...</title>
    <link rel="stylesheet" href="css/styles.css">
    <style>
        /* styles.cssの変数を使い、サイト全体のデザインと一貫性を持たせます */
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            /* 背景色はstyles.cssの--bg-colorと同じ */
            background-color: var(--bg-color, #121212);
            overflow: hidden;
        }

        .spinner {
            border: 4px solid rgba(224, 224, 224, 0.3); /* text-colorの薄い色 */
            /* スピナーの色はstyles.cssの--secondary-colorと同じ */
            border-top: 4px solid var(--secondary-color, #03dac6);
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1.5s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="spinner"></div>
    <h2>  Loading...</h2>

    <script>
        // 2000ミリ秒（2秒）後にindex.htmlに遷移します。
        // この時間はサイトの読み込み速度に合わせて調整してください。
        setTimeout(() => {
            window.location.href = 'index.html';
        }, 2000);
    </script>
</body>
</html>
